module_id: M05
title: Agents Tools and Permissions
version: 0.1.0
status: complete-draft
duration_minutes: 150
level: core
prerequisites:
  - M04
outcomes:
  - define an agent boundary and allowed task
  - separate read, propose, approve, and execute permissions
  - design stop conditions and audit evidence
  - test ambiguous, conflicting, and unauthorized requests safely
deliverables:
  - agent-action-map
  - permission-matrix
  - safe-action-test-log
  - approval-and-stop-rules
frameworks:
  - NIST AI RMF
  - NIST CSF 2.0
  - MITRE ATLAS
safety:
  - approved-workspace-only
  - synthetic-or-deidentified-data-only
  - no-unauthorized-testing
  - no-secrets-or-personal-data
